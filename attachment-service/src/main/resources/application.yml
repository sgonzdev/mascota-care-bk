spring:
  application:
    name: attachment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5439/attachment_db}
    username: ${SPRING_DATASOURCE_USERNAME:mascotacare}
    password: ${SPRING_DATASOURCE_PASSWORD:mascotacare_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# Configuración de MinIO/S3 — endpoint + credenciales.
mascotacare:
  s3:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    region:   ${MINIO_REGION:us-east-1}
    bucket:   ${MINIO_BUCKET:case-attachments}
    access-key: ${MINIO_ACCESS_KEY:mascotacare}
    secret-key: ${MINIO_SECRET_KEY:mascotacare-dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.mascotacare.attachment.service.controller, com.mascotacare.attachment.service.config
  paths-to-match: /api/**
