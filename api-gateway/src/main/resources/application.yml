spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: pet-service
          uri: lb://pet-service
          predicates: [Path=/api/pets/**]
        - id: symptom-service
          uri: lb://symptom-service
          predicates: [Path=/api/symptoms/**]
        - id: rules-engine
          uri: lb://rules-engine
          predicates: [Path=/api/rules/**, Path=/api/triage/**]
        - id: guide-service
          uri: lb://guide-service
          predicates: [Path=/api/guides/**]
        - id: followup-service
          uri: lb://followup-service
          predicates: [Path=/api/followups/**]
        - id: metrics-service
          uri: lb://metrics-service
          predicates: [Path=/api/metrics/**]
        - id: notification-service
          uri: lb://notification-service
          predicates: [Path=/api/notifications/**]

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
