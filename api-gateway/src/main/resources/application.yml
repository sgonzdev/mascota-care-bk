spring:
  application:
    name: api-gateway
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:mascotacare}
    password: ${SPRING_DATASOURCE_PASSWORD:mascotacare_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  codec:
    max-in-memory-size: 110MB  # adjuntos hasta ~100MB via /api/attachments
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # ─── Swagger/OpenAPI (públicos, sin token) ────────────────────────
        - id: swagger-pet
          uri: lb://pet-service
          predicates: [Path=/docs/pets/**]
          filters: [{name: RewritePath, args: {regexp: "/docs/pets/?(?<seg>.*)", replacement: "/${seg}"}}]
        - id: swagger-symptom
          uri: lb://symptom-service
          predicates: [Path=/docs/symptoms/**]
          filters: [{name: RewritePath, args: {regexp: "/docs/symptoms/?(?<seg>.*)", replacement: "/${seg}"}}]
        - id: swagger-rules
          uri: lb://rules-engine
          predicates: [Path=/docs/rules/**]
          filters: [{name: RewritePath, args: {regexp: "/docs/rules/?(?<seg>.*)", replacement: "/${seg}"}}]
        - id: swagger-guide
          uri: lb://guide-service
          predicates: [Path=/docs/guides/**]
          filters: [{name: RewritePath, args: {regexp: "/docs/guides/?(?<seg>.*)", replacement: "/${seg}"}}]
        - id: swagger-followup
          uri: lb://followup-service
          predicates: [Path=/docs/followups/**]
          filters: [{name: RewritePath, args: {regexp: "/docs/followups/?(?<seg>.*)", replacement: "/${seg}"}}]
        - id: swagger-metrics
          uri: lb://metrics-service
          predicates: [Path=/docs/metrics/**]
          filters: [{name: RewritePath, args: {regexp: "/docs/metrics/?(?<seg>.*)", replacement: "/${seg}"}}]
        - id: swagger-notification
          uri: lb://notification-service
          predicates: [Path=/docs/notifications/**]
          filters: [{name: RewritePath, args: {regexp: "/docs/notifications/?(?<seg>.*)", replacement: "/${seg}"}}]
        # ─── APIs de negocio ──────────────────────────────────────────────
        - id: pet-service
          uri: lb://pet-service
          predicates: [Path=/api/pets/**]
        - id: symptom-service
          uri: lb://symptom-service
          predicates: [Path=/api/symptoms/**]
        - id: symptom-consultations
          uri: lb://symptom-service
          predicates: [Path=/api/consultations/**]
        - id: rules-engine-rules
          uri: lb://rules-engine
          predicates: [Path=/api/rules/**]
        - id: rules-engine-triage
          uri: lb://rules-engine
          predicates: [Path=/api/triage/**]
        - id: guide-service
          uri: lb://guide-service
          predicates: [Path=/api/guides/**]
        - id: followup-service
          uri: lb://followup-service
          predicates: [Path=/api/followups/**]
        - id: metrics-service
          uri: lb://metrics-service
          predicates: [Path=/api/metrics/**]
        - id: notification-service
          uri: lb://notification-service
          predicates: [Path=/api/notifications/**]
        - id: notification-clinics
          uri: lb://notification-service
          predicates: [Path=/api/clinics/**]
        - id: notification-ws
          uri: lb:ws://notification-service
          predicates: [Path=/ws/**]
        - id: attachment-service
          uri: lb://attachment-service
          predicates: [Path=/api/attachments/**]

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

jwt:
  secret: ${JWT_SECRET:cambia-esto-en-produccion-min-32-chars-12345}
  access-ttl-seconds: 900
  refresh-ttl-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    com.mascotacare.api.gateway: INFO
