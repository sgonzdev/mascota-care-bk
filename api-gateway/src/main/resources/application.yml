spring:
  application:
    name: api-gateway
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:mascotacare}
    password: ${SPRING_DATASOURCE_PASSWORD:mascotacare_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: pet-service
          uri: lb://pet-service
          predicates: [Path=/api/pets/**]
        - id: symptom-service
          uri: lb://symptom-service
          predicates: [Path=/api/symptoms/**]
        - id: rules-engine-rules
          uri: lb://rules-engine
          predicates: [Path=/api/rules/**]
        - id: rules-engine-triage
          uri: lb://rules-engine
          predicates: [Path=/api/triage/**]
        - id: guide-service
          uri: lb://guide-service
          predicates: [Path=/api/guides/**]
        - id: followup-service
          uri: lb://followup-service
          predicates: [Path=/api/followups/**]
        - id: metrics-service
          uri: lb://metrics-service
          predicates: [Path=/api/metrics/**]
        - id: notification-service
          uri: lb://notification-service
          predicates: [Path=/api/notifications/**]

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

jwt:
  secret: ${JWT_SECRET:cambia-esto-en-produccion-min-32-chars-12345}
  access-ttl-seconds: 900
  refresh-ttl-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    com.mascotacare.api.gateway: INFO
