spring:
  application:
    name: rules-engine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/rules_db}
    username: ${SPRING_DATASOURCE_USERNAME:mascotacare}
    password: ${SPRING_DATASOURCE_PASSWORD:mascotacare_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring.data.redis:
  host: ${SPRING_DATA_REDIS_HOST:localhost}
  port: 6379

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.mascotacare.rules.engine.controller, com.mascotacare.rules.engine.config
  paths-to-match: /api/**
